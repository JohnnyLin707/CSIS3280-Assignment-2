<!doctype html>
<html><head>
    <title>Assignment 2: Page 1</title>
    <style>.error { background-color: pink; padding: 1rem;}</style>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
</head>
<body>

<div class="container">
    <h1>Student Form</h1>
    
    <div class="form-control is-invalid">
        <ul>
            
                <li>Error message 1</li>
            
        </ul>
    </div>
    
    <form method="POST">
    <div class="form-group row">
        <label for="studentName" class="col-sm-2 col-form-label">Name</label>
        <div class="col-sm-10">
            <input name="studentName" value="" placeholder="John Doe" class="form-control">
        </div>
    </div>
    <div class="form-group row">
        <label for="studentID" class="col-sm-2 col-form-label">ID</label>
        <div class="col-sm-10"><input name="studentID" value="" placeholder="01234567890" class="form-control"></div>
        
    </div>
    <div class="form-group row">
        <label for="studentEmail" class="col-sm-2 col-form-label">Email</label>
        <div class="col-sm-10"><input name="studentEmail" value="" placeholder="here@there.com" class="form-control"></div>
        
    </div>
    <div class="form-group row">
        <label for="studentTerm" class="col-sm-2 col-form-label">Term</label>
        <div class="col-sm-10"><input name="studentTerm" value="" placeholder="(Fall|Winter|Summer) 202X" class="form-control"></div>        
    </div>
    <div class="form-group row">
        <label for="studentDept" class="col-sm-2 col-form-label">Department</label>    
        <div class="col-sm-10">
            <select name="studentDept" class="form-control">
            <option value="">Select one</option>
            </select>
        </div>
        
    
    </div>
    
        
    <div class="form-group row">
        <div class="col-sm-2">Course</div>
        <div class="col-sm-10">
            <div class="form-check form-check-inline">
                <input name="studentCourse[]" type="checkbox" value="course1" id="studentCourse1">
                <label class="form-check-label" for="studentCourse1">Course 1</label>
                
                <input name="studentCourse[]" type="checkbox" value="international" id="studentCourse1">
                <label class="form-check-label" for="studentCourse2">Course 2</label>
            </div> 
        </div>
         
    </div>
    <div class="form-group row">
        <div class="col-sm-2">Status</div>
        <div class="col-sm-10">
            <div class="form-check form-check-inline">
                <input name="studentStatus" type="radio" value="domestic" id="studentStatus1">
                <label class="form-check-label" for="studentStatus1">domestic</label>
                
                <input name="studentStatus" type="radio" value="international">
                <label class="form-check-label" for="studentStatus2">international</label>
            </div> 
        </div>
         
    </div>
    
    <div class="form-group row">
        <input type="submit" class="btn btn-success">
    </div>
</form>
</div>
</body></html>
